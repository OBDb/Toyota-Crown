  - "https://en.wikipedia.org/wiki/Toyota_Crown"

generations:
  - name: "First Generation (RS/S10/S20/S30)"
    start_year: 1955
    end_year: 1962
    description: "The first-generation Toyota Crown established what would become Toyota's flagship sedan, representing the company's first true luxury offering. Introduced in January 1955, it featured formal styling with American-influenced elements including pronounced fenders and substantial chrome accents. The Crown was offered in sedan, wagon, and commercial vehicle variants, with the Masterline name used for commercial versions. Powered initially by a 1.5-liter four-cylinder engine (later 1.9-liter), it emphasized build quality and comfort. Notable features included independent front coil suspension and 'suicide' rear doors. The Crown became Japan's first diesel passenger car with the introduction of the Crown Diesel in October 1959. This generation was Toyota's first export model to the United States beginning in 1958, though sales were modest due to performance limitations on American highways."

  - name: "Second Generation (S40)"
    start_year: 1962
    end_year: 1967
    description: "The second-generation Crown, designated S40, was dramatically restyled and enlarged following the introduction of the Corona. It featured a new X-frame chassis replacing the ladder frame, achieving a lower center of gravity. The stylized 'crown' badge first appeared on the grille and hubcaps with this generation. Headlights were integrated within an enlarged grille for a modern appearance. The Toyotaoglide two-speed automatic transmission was introduced. Initially powered by four-cylinder R-series engines, the six-cylinder M engine was added in 1965. This Crown became the first Toyota exported to Europe and was assembled in Australia from CKD kits, marking the beginning of Toyota's Australian manufacturing presence. A limited-run performance variant called Crown S featured twin SU carburetors, sport suspension, and disc brakes."

  - name: "Crown Eight (G10)"
    start_year: 1964
    end_year: 1967
    description: "The Crown Eight was a longer, wider, and more upmarket variant introduced in April 1964, powered by a 2.6-liter V8 engine - the first Japanese mass-produced vehicle with an eight-cylinder engine. Although based on the S40 platform, it carried the unique G10 model designation and was branded simply as 'Toyota' rather than 'Toyopet'. Developed and assembled by Kanto Auto Works due to its unique components, the Crown Eight was designed as a corporate flagship to replace full-sized American automobiles. Features exclusive to the Eight included climate control, automatic headlamps, electrically powered windows, electric cruise control, and electromagnetic door latches. The front seat could recline flat to the rear seat, and the interior featured silk brocade upholstery. Approximately 3,800 units were produced before it was replaced by the Toyota Century in 1967."

  - name: "Third Generation (S50)"
    start_year: 1967
    end_year: 1971
    description: "The third-generation Crown launched in 1967 with largely carryover mechanicals but additional equipment and improved collision protection. The X-frame chassis was replaced with a perimeter frame design that would remain in use until 1999. Higher specification models used the 2.0-liter M or 2.3-liter 2M six-cylinder engines shared with the Toyota 2000GT. A premium Super Saloon trim level was introduced, featuring twin carburetors, electric windows, and luxury fabric. The Crown range expanded to include a four-door station wagon, pick-up, double cab pick-up, and in October 1968, a two-door hardtop personal luxury car. This was the last generation to offer pick-up variants and the only one with a double-hinged tailgate. Power steering became available in September 1968, and a facelift arrived in 1969 with updated headlight, grille, and trim arrangements. The two-door hardtop would be the final coupe version."

  - name: "Fourth Generation (S60/S70)"
    start_year: 1971
    end_year: 1974
    description: "The fourth-generation Crown launched in February 1971 for the Japanese Domestic Market, available in Deluxe, Super Deluxe, and Super Saloon trim levels. The Royal Saloon trim was introduced with the 1973 facelift, adding Century-derived luxury features. This generation marked the first Crown officially marketed worldwide as 'Toyota' rather than 'Toyopet'. The 4M 2600 engine was introduced alongside the 2.0-liter five-cylinder and 2.0-liter M six-cylinder options. Styling featured rectangular halogen headlights for domestic market hardtops and twin round headlights for export models, with flush 'spindle-shaped' bumpers. The Japanese market Crown was known as the 'whale' or 'kujira' Crown due to its distinctive styling. The first two model years were marketed in North America before the Corona Mark II replaced the Crown there. This was also the first generation assembled in New Zealand."

  - name: "Fifth Generation (S80/S90/S100)"
    start_year: 1974
    end_year: 1979
    description: "The fifth-generation Crown launched in October 1974, offered as a four-door sedan, two-door hardtop coupe, four-door hardtop sedan, wagon, and van. Trim levels included Standard, Deluxe, Super Saloon, and Royal Saloon. Engines ranged from 2.0 to 2.6 liters gasoline, with a 2.2-liter diesel introduced in October 1977. The Royal Saloon featured a longer body style, exceeding Japanese length regulations by 65mm. This was the last Crown to offer a one-piece front bench seat. A 1978 update introduced four-wheel disc brakes with anti-lock braking, speed-sensitive power steering, and a four-speed automatic with overdrive. Sedans and wagons used S80-series chassis codes while hardtops received S90-series, later unified to S100-series for 1976 onwards. The pillared hardtop with Royal Saloon trim became an alternative to the Nissan Cedric and Gloria. This was the last Crown built in New Zealand."

  - name: "Sixth Generation (S110)"
    start_year: 1979
    end_year: 1983
    description: "The sixth-generation Crown launched in 1979 with the engine upgraded to a 2.8-liter 5M-EU inline-six, representing the last generation to install a four-cylinder gasoline engine. Model designations reflected engine size: MS110 (2.0L), MS111 (2.6L), and MS112 (2.8L). The first Crown Turbo launched in October 1980 for the Japanese market, using a turbocharged 2.0-liter M-TEU engine. This was the final generation for the two-door hardtop coupe bodystyle, which was replaced by the Toyota Soarer. Styling featured twin rectangular headlights on early models, updated to monoblock headlights on facelift models. Options included an electronic compass, glass moonroof, power driver's seat, cruise control, and automatic climate control with rear-seat controls and a rear-mounted mini fridge. The 2.4-liter turbo-diesel appeared in August 1982. This was the first Crown sold in Germany, beginning in 1980."

  - name: "Seventh Generation (S120)"
    start_year: 1983
    end_year: 1987
    description: "The seventh-generation Crown launched in 1983 utilizing three versions of the 5M 2.8L engine: carbureted, fuel-injected (5M-E), and DOHC (5M-GE). Additional engine options included the 1G-GE 2.0L DOHC, M-TE turbocharged 2.0L, and 2.4L turbodiesel. A supercharged 2.0-liter G-series six replaced the turbocharged M-series in September 1985. This generation introduced Toyota's PEGASUS four-wheel independent suspension, TEMS electronically controlled shock absorbers, ECT four-speed automatic transmission, and 4ESC anti-lock brakes. Available in hardtop sedan (with frameless door glass), sedan, and wagon versions in two different exterior dimensions. The top Royal Saloon trim featured dual-zone climate control, integrated CD player, rear cassette stereo with headphones, parcel shelf refrigerator, and electrically adjustable steering column with seat memory. This was the last Crown commonly available in European markets."

  - name: "Eighth Generation (S130)"
    start_year: 1987
    end_year: 1999
    description: "The eighth-generation Crown launched in 1987 as a sedan, hardtop, and wagon including commercial van models. Engine options included the 7M-GE 3.0L DOHC, 1G-GZE 2.0L DOHC supercharged, 1G-GE and 1G-E 2.0L DOHC, 2L-THE and 2L-TE 2.4L turbodiesel, and the 4.0-liter 1UZ-FE V8 in the Royal Saloon G (later becoming the Crown Majesta). This was the first Toyota available with an airbag in 1988. In 1989, the Royal Saloon G introduced the world's first CD-ROM-based automotive navigation system with color CRT display. A 1989 facelift brought more aerodynamic front and rear styling, while the 4-liter V8 was introduced. The 2.5-liter 1JZ-GE engine arrived in August 1990. In August 1991, a major restyle kept the S130 code for sedans and wagons while the hardtop became S140. Sales of sedan stopped in December 1995, with wagon and van continuing until December 1999. This generation was assembled in Indonesia from 1989 to 2000."

  - name: "Ninth Generation (S140)"
    start_year: 1991
    end_year: 1995
    description: "The ninth-generation Crown hardtop launched in 1991 with a dramatic departure from traditional styling, introducing the new Royal Touring trim level. Produced exclusively in right-hand drive due to no left-hand drive versions being developed. Engine options for the hardtop included the 2JZ-GE 3.0L DOHC, 1JZ-GE 2.5L DOHC, and 2L-THE 2.4L turbodiesel, while sedan and wagon models carried over the 1G-FE 2.0L DOHC from the eighth generation. Trim levels included Super Select, Super Saloon Extra, Royal Touring, Royal Saloon, and Royal Saloon G. Styling featured a more curved front and rear end with wrap-around taillights, influenced by the 1989 Toyota Celsior. The design was initially negatively received, causing lower sales than competitors. A 1993 facelift restored more traditional styling including Crown emblems on the C-pillars, which improved reception and sales performance."

  - name: "Tenth Generation (S150)"
    start_year: 1995
    end_year: 1999
    description: "The tenth-generation Crown launched in 1995 as a sedan and hardtop only, marking the first Crown built with unibody construction rather than body-on-frame. The wagon retained the older S130 chassis until 1999. Hardtop trim levels included Royal Extra, Royal Saloon, Royal Saloon G, and sporty Royal Touring, while sedans offered Super Deluxe, Super Saloon, Super Saloon Extra, and Royal Saloon. Engine options were exclusively inline six-cylinder gasoline units in 2.0, 2.5, or 3.0-liter displacements, plus an LPG 2.0L version and 2.4L turbodiesel. All-wheel drive was available on Royal Extra and Royal Saloon models. The S150 was the last Crown offered with a manual transmission. It won the 1996 Automotive Researchers' and Journalists' Conference Car of the Year award in Japan. Export was limited mainly to China, Hong Kong, Middle East, and Southeast Asian markets."

  - name: "Eleventh Generation (S170)"
    start_year: 1999
    end_year: 2003
    description: "The eleventh-generation Crown launched in September 1999 featuring shorter front overhangs to maximize interior and trunk space. Two distinct sedan variants were offered: the Royal (more luxurious) and Athlete (sportier). The four-door hardtop was discontinued, and no left-hand drive versions were produced, restricting exports to right-hand drive markets. The Crown Estate wagon launched in December 1999 as the first new Crown Wagon since the S130 series, continuing production until June 2007. Engines included 2.0, 2.5, or 3.0-liter inline-sixes, with the Athlete V receiving a 2.5-liter 1JZ-GTE turbo in both sedan and wagon versions. The Royal Saloon offered a 3.0-liter 2JZ-FSE mild hybrid from August 2001 to 2003 using a belted alternator starter system. A 2001 update changed tail lamps to LED and introduced a mesh front grille. Electronically controlled air suspension combining nonlinear damping control was an innovation."

  - name: "Twelfth Generation (S180)"
    start_year: 2003
    end_year: 2008
    description: "The twelfth-generation Crown released in late 2003 was based on the Zero Crown concept car. The platform switched to the Toyota N platform with increased wheelbase and body width, providing the largest interior among contemporary vehicles including the Mercedes-Benz S-Class and BMW 7 Series. Engines changed to V6 units for Royal and Athlete models, while the Crown Majesta retained the V8 in 4.3-liter form with optional four-wheel drive. Radar Pre-Collision System added a single digital camera for improved collision warning and control. Left-hand drive Crowns became available for the first time since 2001, produced exclusively in China by Tianjin FAW Toyota Motor. G-BOOK telematics was introduced in May 2006. A 2005 facelift included redesigned taillights, with Athlete models receiving smoked head- and taillights. The 3.5-liter 2GR-FSE engine became available on Athlete models. The S170 Estate continued alongside sedans until replaced by the Toyota Alphard."

  - name: "Thirteenth Generation (S200)"
    start_year: 2008
    end_year: 2012
    description: "The thirteenth-generation Crown was available in four trim levels: Royal (comfortable and luxurious), Athlete (aggressive styling with sporty features), Majesta (more luxurious than Royal with distinctive styling), and Hybrid (Hybrid Synergy Drive V6 drivetrain). The Crown Athlete achieved 0-100 km/h in under 6 seconds, while the Hybrid was estimated at 5.4 seconds due to additional hybrid motor power. A February 2010 facelift included a less 'smiley' front grille, new headlamps and taillights, and technical revisions. This generation introduced multiple world-first safety technologies: Navigation/AI-Adaptive Variable Suspension, active noise control, PCS collision avoidance with front-side millimeter wave radar and GPS-navigation linked brake assist, Night View with pedestrian detection, updated Driver Monitoring System for drowsiness detection, and the world's first center airbag in 2009."

  - name: "Fourteenth Generation (S210)"
    start_year: 2012
    end_year: 2018
    description: "The fourteenth-generation Crown launched on December 25, 2012 with styling paying homage to the fifth-generation MS105 series in the Royal series front design. Most functions could be controlled by a Toyota Multi-Operation Touch panel. The Crown Hybrid went on sale in January 2013. A October 2015 facelift introduced a three-dimensional mesh grille for Athlete models, Bi-Beam LED headlights with single light source for high and low beam, daytime running lights, and ring-shaped rear lamps. A special edition 'Reborn Pink' was produced in September 2013 featuring a bright pink exterior and interior details. Production in Japan ended in June 2018, replaced by the S220 model. Chinese production continued until May 2020, where it was succeeded by the Toyota Avalon XX50. The Chinese market S210 launched in March 2015 with the 2.0-liter 8AR-FTS turbocharged engine and 8-speed automatic transmission."

  - name: "Fifteenth Generation (S220)"
    start_year: 2018
    end_year: 2022
    description: "The fifteenth-generation Crown was unveiled at the 45th Tokyo Motor Show in October 2017 and went on sale June 26, 2018. Built on the TNGA-L platform shared with Lexus and luxury Toyota sedans, it offered three engine choices: 2.0-liter turbocharged four-cylinder, 2.5-liter hybrid with Hybrid Synergy Drive, and 3.5-liter V6 hybrid with Multi Stage Hybrid system from the Lexus LC 500h and LS 500h. Trim levels included B, S, G, G Executive, RS-B, RS, and RS Advance, all available with rear-wheel drive or full-time all-wheel drive. A November 2020 interior update replaced the dual-screen design with a single 12.3-inch touchscreen and more intuitive physical climate controls. The S220 was selected by the Indonesian government in October 2019 for cabinet minister vehicles, though only imported in small numbers and not available for consumer purchase. This generation was equipped with Toyota Safety Sense 2.0 including Lane Tracing Assist and enhanced Pre-Collision System."

  - name: "Sixteenth Generation (S230)"
    start_year: 2022
    end_year: null
    description: "The sixteenth-generation Crown represents the most dramatic reinvention in the nameplate's history, introducing four distinct body styles: Crossover, Sport, Sedan, and Estate/Signia. Marketed as a 'reboot' of the Crown nameplate, it became available globally for the first time in history across approximately 40 countries. The Crossover launched first in September 2022 as a 'crossover sedan' combining full-size sedan and SUV proportions with elevated ride height. Built on the TNGA-K front-wheel drive platform, it features standard 'E-Four' electric four-wheel drive. Powertrains include a 2.5-liter hybrid producing 236 combined horsepower and a turbocharged 2.4-liter 'Hybrid Max' system producing 340 combined horsepower with a six-speed automatic transmission. The Crown returned to North America after a 50-year absence, replacing the Avalon. The Sedan launched in November 2023 on the GA-L platform with longitudinal engine and rear-wheel drive, available as hybrid and fuel cell. The Sport arrived in October 2023, followed by the Estate (marketed as Signia in North America) in June 2024."